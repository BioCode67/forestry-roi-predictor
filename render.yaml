# Render 블루프린트 — 이 파일 하나로 서비스가 정의됩니다.
# render.com → New → Blueprint → 이 저장소 선택 → Apply
#
# 무료 등급은 15분 놀면 잠들고, 다음 접속에서 다시 뜨는 데 40~60초가 걸립니다.
# 심사위원이 처음 열 때 그 시간을 기다리게 되므로, 신청서에는 주소와 함께
# "처음 열 때 1분 정도 걸릴 수 있습니다"를 적어 두는 편이 좋습니다.
services:
  - type: web
    name: forestry-roi-predictor
    runtime: docker
    plan: free
    region: singapore          # 한국에서 가장 가까운 지역
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true           # main에 push하면 자동으로 다시 배포됩니다
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
