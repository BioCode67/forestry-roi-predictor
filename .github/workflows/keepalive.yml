# Render 무료 등급 깨워 두기
#
# 무료 등급은 15분 놀면 잠들고, 다음 접속에서 다시 뜨는 데 40~60초가 걸립니다.
# 심사위원이 처음 열 때 그 시간을 기다리게 되므로 주기적으로 두드려 깨워 둡니다.
#
# 별도 서비스에 가입할 필요 없이 이 저장소만으로 됩니다. 다만 GitHub Actions의
# 예약 실행은 정확한 시각을 보장하지 않아 5~15분씩 밀릴 수 있습니다. 깨어
# 있게 하는 목적에는 그 정도면 충분합니다.
#
# 두 가지 유의할 점
#  · 무료 등급은 월 750시간이 주어집니다. 계속 깨워 두면 한 달 내내 도는 셈이라
#    (24×31=744시간) 이 한도를 거의 다 씁니다. 서비스가 하나뿐이라 괜찮습니다.
#  · 저장소가 60일 넘게 조용하면 GitHub가 예약 실행을 멈춥니다. 그때는
#    Actions 탭에서 다시 켜면 됩니다.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다
  workflow_dispatch:          # 손으로도 돌릴 수 있게

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 서비스 깨우기
        run: |
          URL="https://forestry-roi-predictor.onrender.com/api/health"
          # 잠들어 있으면 첫 응답까지 1분 가까이 걸립니다. 넉넉히 기다립니다.
          code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 180 "$URL" || echo 000)
          echo "HTTP $code"
          head -c 300 /tmp/body; echo
          # 깨우는 것이 목적이라 한 번 실패했다고 빨간불을 켜지는 않습니다.
          # 다만 응답이 200이 아니면 로그에 남깁니다.
          if [ "$code" != "200" ]; then
            echo "::warning::health가 $code 를 돌려줬습니다. Render 로그를 확인하십시오."
          fi
